<svg xmlns="http://www.w3.org/2000/svg" width="800" height="175">
  <title>Norman Battle Order Determination Table - Foot</title>
  <desc>The Norman Battle Order Determination Table for Foot units</desc>

  <g id="background_rectangles">
    <rect id="background" width="100%" height="100%" fill="rgb(210,90,120)" stroke="black" stroke-width="1"/>
    <rect id="order_background" x="2%" y="18%" width="96%" height="80%" fill="white" stroke="black" stroke-width="2"/>
  </g>

  <g id="lines">  
    <line id="header_line" x1="2%" y1="38%" x2="98%" y2="38%" stroke="black" stroke-width="2"/>
    <line id="col1" x1="27%" y1="18%" x2="27%" y2="98%" stroke="black" stroke-width="2"/>
    <line id="col2" x1="37%" y1="18%" x2="37%" y2="98%" stroke="black" stroke-width="2"/>
  </g>

  <g id="unit_type">
    <text x="10" y="14%" font-weight="bold">FOOT</text>
  </g>

  <g id="headers">
    <text id="header" font-size="14" font-weight="bold" text-anchor="middle">
      <tspan x="14.5%" y="31%">Battle Order</tspan>
      <tspan x="32%" y="27%">Strategy</tspan>
      <tspan x="32%" dy="8%">Effect</tspan>
      <tspan x="44.625%" y="31%">AGGRESSIVE</tspan>
      <tspan x="59.875%" y="31%">MODERATE</tspan>
      <tspan x="75.125%" y="31%">CAUTIOUS</tspan>
      <tspan x="90.375%" y="31%">DEFENSIVE</tspan>
    </text>
  </g>

  <g id="orders">
    <g id="shield_wall">
      <text id="order" font-size="13" font-weight="bold" y="50%" text-anchor="middle">
        <tspan x="3%" text-anchor="start">Shield Wall</tspan>
        <tspan x="32%">-2</tspan>
        <tspan x="44.625%">5</tspan>
        <tspan x="59.875%">4,5</tspan>
        <tspan x="75.125%">3,4,5</tspan>
        <tspan x="90.375%">4,5,9</tspan>
      </text>
    </g>

    <g id="melee_fire_in_place">
      <text id="order" font-size="13" font-weight="bold" y="61%" text-anchor="middle">
        <tspan x="3%" text-anchor="start">Melee/Fire in Place</tspan>
        <tspan x="32%">-1</tspan>
        <tspan x="44.625%">10,11,12</tspan>
        <tspan x="59.875%">9,10,12</tspan>
        <tspan x="75.125%">9,10,11</tspan>
        <tspan x="90.375%">8,10,11,12</tspan>
      </text>
    </g>

    <g id="advance_to_combat_1">
      <text id="order" font-size="13" font-weight="bold" y="72%" text-anchor="middle">
        <tspan x="3%" text-anchor="start">Adv to Combat, 1 turn</tspan>
        <tspan x="32%">+1</tspan>
        <tspan x="44.625%">6,7,8,9</tspan>
        <tspan x="59.875%">6,7,8,11</tspan>
        <tspan x="75.125%">6,7,8</tspan>
        <tspan x="90.375%">3,6,7</tspan>
      </text>
    </g>

    <g id="advance_to_combat_2">
      <text id="order" font-size="13" font-weight="bold" y="83%" text-anchor="middle">
        <tspan x="3%" text-anchor="start">Adv to Combat, 2 turns</tspan>
        <tspan x="32%">+1/+1</tspan>
        <tspan x="44.625%">3,4</tspan>
        <tspan x="59.875%">3</tspan>
        <tspan x="75.125%">12</tspan>
        <tspan x="90.375%">-</tspan>
      </text>
    </g>

    <g id="optional">
      <text id="order" font-size="13" font-weight="bold" y="94%" text-anchor="middle">
        <tspan x="3%" text-anchor="start">Optional</tspan>
        <tspan x="32%">?</tspan>
        <tspan x="44.625%">2</tspan>
        <tspan x="59.875%">2</tspan>
        <tspan x="75.125%">2</tspan>
        <tspan x="90.375%">2</tspan>
      </text>
    </g>
  </g>
</svg>
